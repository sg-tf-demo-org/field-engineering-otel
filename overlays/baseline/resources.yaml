# Baseline resource limits for product-reviews (healthy).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-reviews
  namespace: otel-demo
  labels:
    otel-sre-demo: "true"
spec:
  template:
    spec:
      containers:
        - name: product-reviews
          resources:
            limits:
              memory: 100Mi
            requests:
              memory: 64Mi
---
# Baseline resource limits for postgresql (healthy).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: otel-demo
  labels:
    otel-sre-demo: "true"
spec:
  template:
    spec:
      containers:
        - name: postgresql
          resources:
            limits:
              memory: 100Mi
            requests:
              memory: 64Mi
---
# Baseline product-catalog image (healthy upstream OTel demo).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog
  namespace: otel-demo
  labels:
    otel-sre-demo: "true"
spec:
  template:
    spec:
      containers:
        - name: product-catalog
          image: ghcr.io/open-telemetry/demo:2.2.0-product-catalog
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              memory: 20Mi
